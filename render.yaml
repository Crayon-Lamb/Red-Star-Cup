services:
  - type: web
    name: hongxingbei
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PASSWORD
        value: hongxingbei2026
      - key: SECRET_KEY
        generateValue: true
